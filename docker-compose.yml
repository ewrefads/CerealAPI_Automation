services:
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: cerealdb
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  cerealapiTest:
#    image: ${DOCKER_REGISTRY-}cerealapitest
    build:
      context: .
      dockerfile: CerealAPITest/Dockerfile
    depends_on:
       db:
        condition: service_healthy
    restart: always
    ports:
        - 8081:8081 
  cerealapi:
#    image: ${DOCKER_REGISTRY-}cerealapi
    build:
      context: .
      dockerfile: CerealAPI/Dockerfile
    depends_on:
       db:
        condition: service_healthy
       cerealapiTest:
        condition: service_healthy
    restart: always
    environment:
        ConnectionStrings__DefaultConnection: "server=db;port=3306;database=cerealdb;user=root;password=test"
    ports:
        - 8083:8080 
volumes:
  mysql_data:

  